name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Server & Client Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Syntax check server files
        working-directory: server
        run: |
          node --check server.js
          for f in routes/*.js middleware/*.js models/*.js; do node --check "$f"; done

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Build client
        working-directory: client
        run: npm run build
